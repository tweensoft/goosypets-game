<aside class="panel right"><h2>🎨 Colors & Tools</h2><div class="sub"><h3>Colors</h3><div class="palette" id="palette"></div></div><div class="sub"><h3>Tools</h3><div class="tools"><button class="tool on" data-tool="crayon">🖍️<br>Crayon</button><button class="tool" data-tool="brush">🖌️<br>Brush</button><button class="tool" data-tool="eraser">🧽<br>Eraser</button></div><div class="size"><span>Size</span><input id="size" type="range" min="4" max="42" value="18"></div></div><div class="sub"><div class="actions"><button class="act undo" id="undo">↶ Undo</button><button class="act clear" id="clear">Clear</button><button class="act save" id="save">⬇ Save Art</button></div></div><div class="hint">Use your finger or Apple Pencil directly on the page.</div></aside>
</div></div><div class="toast" id="toast">Saved!</div>
<script>
(()=>{const canvas=document.getElementById('paint'),ctx=canvas.getContext('2d'),page=document.getElementById('page'),palette=document.getElementById('palette'),size=document.getElementById('size'),toast=document.getElementById('toast');const colors=['#ff2d2d','#ff8c1a','#ffd426','#1bbb69','#1677f2','#8c3df0','#f248ad','#8b542c','#3f4248','#ffffff','#26cfe8','#ffb0c8'];let color=colors[1],tool='crayon',drawing=false,last=null,history=[];colors.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i===1?' on':'');b.style.background=c;b.onclick=()=>{color=c;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(tool==='eraser')setTool('brush')};palette.appendChild(b)});document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x.dataset.tool===t))}function fit(){const r=page.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2.5),old=document.createElement('canvas');old.width=canvas.width;old.height=canvas.height;old.getContext('2d').drawImage(canvas,0,0);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,r.width,r.height);if(old.width&&old.height)ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height)}function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function snap(){history.push(canvas.toDataURL());if(history.length>15)history.shift()}function start(e){e.preventDefault();snap();drawing=true;last=pos(e);draw(last,last);canvas.setPointerCapture?.(e.pointerId)}function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);draw(last,p);last=p}function end(){drawing=false;last=null}function draw(a,b){const w=+size.value;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=tool==='eraser'?'#fffaf0':color;ctx.globalAlpha=tool==='crayon'?.46:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(tool==='crayon'){ctx.globalAlpha=.2;for(let i=0;i<3;i++){const ox=(Math.random()-.5)*w*.4,oy=(Math.random()-.5)*w*.4;ctx.beginPath();ctx.moveTo(a.x+ox,a.y+oy);ctx.lineTo(b.x+ox,b.y+oy);ctx.stroke()}}ctx.restore()}canvas.addEventListener('pointerdown',start,{passive:false});canvas.addEventListener('pointermove',move,{passive:false});canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);document.getElementById('undo').onclick=()=>{const u=history.pop();if(!u)return;const im=new Image();im.onload=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0,canvas.width,canvas.height);ctx.restore()};im.src=u};document.getElementById('clear').onclick=()=>{snap();const r=page.getBoundingClientRect();ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,r.width,r.height)};document.getElementById('save').onclick=()=>{const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const o=out.getContext('2d');o.drawImage(canvas,0,0);const svg=document.querySelector('.line');const xml=new XMLSerializer().serializeToString(svg);const blob=new Blob([xml],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),im=new Image();im.onload=()=>{o.drawImage(im,0,0,out.width,out.height);URL.revokeObjectURL(url);const a=document.createElement('a');a.download='goosypets-cookiecat-art.png';a.href=out.toDataURL('image/png');a.click();toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)};im.src=url};new ResizeObserver(fit).observe(page);requestAnimationFrame(fit)})();
</script>
